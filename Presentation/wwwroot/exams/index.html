<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luyện thi luật giao thông</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0b7568; --primary-hover: #075c52; --primary-soft: #e3f5ee;
      --accent: #e68a67; --accent-soft: #f5b392; --accent-strong: #da7965;
      --mint: #b7ebd1; --mint-strong: #92dfbc;
      --ink: #11232b; --ink-2: #203942; --on-ink: #f2f7f5; --on-ink-muted: #93afb3;
      --bg-page: #eef3f2; --bg-subtle: #e4eceb; --bg-surface: #ffffff; --bg-surface-hover: #f2f9f6; --bg-elevated: #ffffff;
      --border-light: #e2ebe9; --border-default: #d2dfdd; --border-strong: #92b6b1;
      --text-primary: #132830; --text-secondary: #486066; --text-muted: #647b80;
      --success: #15803d; --success-bg: #ecfdf3; --success-border: #86efac;
      --warning: #b45309; --warning-bg: #fef3c7; --warning-border: #fcd34d;
      --danger: #b91c1c; --danger-bg: #fef2f2; --danger-border: #fca5a5;
      --info: #1d4ed8; --info-bg: #eff6ff; --info-border: #bfdbfe;
      --radius-sm: 12px; --radius-md: 18px; --radius-lg: 24px;
      --shadow-sm: 0 1px 2px rgba(17, 35, 43, .06), 0 1px 3px rgba(17, 35, 43, .04);
      --shadow-md: 0 4px 14px rgba(17, 35, 43, .08);
      --font-sans: 'Be Vietnam Pro', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { font-family: var(--font-sans); font-size: 16px; line-height: 1.5; margin: 0; background: var(--bg-page); color: var(--text-primary); }
    main { max-width: 800px; margin: 32px auto; padding: 0 16px; }
    header, section, article { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
    h1, h2, h3 { color: var(--text-primary); line-height: 1.3; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 700; }
    h2 { margin: 0 0 12px; font-size: 1.25rem; font-weight: 700; }
    h3 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 600; }
    header p, section p { color: var(--text-secondary); margin: 0 0 12px; }
    a { color: var(--primary); }
    label { display: grid; gap: 6px; margin: 12px 0; font-weight: 600; color: var(--text-secondary); }
    input:not([type="radio"]):not([type="hidden"]), select {
      width: 100%; height: 44px; min-height: 44px; padding: 0 12px;
      font: inherit; color: var(--text-primary); background: var(--bg-surface);
      border: 1px solid var(--border-default); border-radius: var(--radius-sm);
    }
    input:not([type="radio"]):not([type="hidden"]):focus, select:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft);
    }
    button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 18px; margin: 8px 8px 8px 0;
      font: inherit; font-size: 1rem; font-weight: 600; cursor: pointer;
      border: 1px solid var(--primary); border-radius: var(--radius-sm);
      background: var(--primary); color: #ffffff;
      transition: background-color .15s ease, border-color .15s ease;
    }
    button:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
    button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
    button:disabled { opacity: .5; cursor: default; }
    #review, #resume { background: transparent; color: var(--primary); border-color: var(--primary); }
    #review:hover:not(:disabled), #resume:hover:not(:disabled) { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-hover); }
    fieldset { border: 0; padding: 0; margin: 12px 0 0; min-width: 0; }
    fieldset label {
      display: flex; gap: 10px; align-items: flex-start;
      margin: 8px 0; padding: 12px 14px; cursor: pointer;
      font-weight: 500; color: var(--text-primary);
      background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-sm);
      transition: background-color .15s ease, border-color .15s ease;
    }
    fieldset label:hover { background: var(--bg-surface-hover); }
    fieldset label:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
    fieldset label:has(input:focus-visible) { box-shadow: 0 0 0 3px var(--primary-soft); }
    fieldset:disabled label { cursor: default; opacity: .6; }
    fieldset:disabled label:hover { background: var(--bg-surface); }
    fieldset:disabled label:has(input:checked) { background: var(--primary-soft); }
    fieldset input[type="radio"] { flex: 0 0 auto; width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--primary); }
    #timer {
      display: inline-block; padding: 2px 12px; border-radius: 999px;
      background: var(--primary-soft); color: var(--primary);
      font-weight: 700; font-variant-numeric: tabular-nums;
    }
    #examId { overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    #practiceTarget { font-weight: 500; }
    #notificationList { margin: 0; padding-left: 20px; color: var(--text-secondary); }
    #message { min-height: 1.5em; margin: 0 4px 16px; font-size: .9rem; color: var(--text-secondary); overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <header><h1>Luyện thi luật giao thông</h1><p>Đề được lưu tự động. Đồng hồ tính theo hạn nộp trên máy chủ.</p></header>
  <section id="setup">
    <h2>Tạo đề</h2>
    <p id="authNotice">Mở trang <a href="/thi" target="_top">luyện thi trong ứng dụng</a> và đăng nhập để tiếp tục.</p>
    <label>Ngân hàng câu hỏi<select id="bankChoice"><option value="">Chọn ngân hàng</option></select></label>
    <input id="category" type="hidden"><input id="version" type="hidden">
    <label>Số câu <input id="count" type="number" min="1" max="100" value="10"></label>
    <label>Thời gian (phút) <input id="minutes" type="number" min="1" max="180" value="30"></label>
    <button id="create">Bắt đầu</button>
    <h3>Đề mẫu đã xuất bản</h3>
    <label>Đề mẫu<select id="templateChoice"><option value="">Chọn đề mẫu</option></select></label>
    <button id="createTemplate">Bắt đầu đề mẫu</button>
    <p>Nếu đã có mã đề, nhập để tiếp tục:</p>
    <label>Mã đề <input id="resumeId"></label><button id="resume">Tiếp tục</button>
  </section>
  <section id="exam" hidden>
    <h2>Đề thi</h2><p>Mã đề: <span id="examId"></span></p>
    <p id="practiceTarget"></p>
    <p>Còn lại: <span id="timer"></span></p>
    <div id="questions"></div>
    <button id="submit">Nộp bài</button>
    <button id="review" hidden>Xem lại từng câu</button>
  </section>
  <section id="notifications" hidden>
    <h2>Thông báo</h2><ul id="notificationList"></ul>
  </section>
  <p id="message" role="status" aria-live="polite"></p>
</main>
<script>
const $ = id => document.getElementById(id);
let exam = null, busy = false, submitting = false;
const query = new URLSearchParams(location.search);
let ready = false;
const pending = new Map();
const notice = message => { $('message').textContent = message; };
window.addEventListener('message', event => {
  if (event.origin !== location.origin || event.source !== parent) return;
  if (event.data?.type === 'exam-ready') {
    ready = true; $('authNotice').hidden = true; loadBanks(); loadTemplates();
  } else if (event.data?.type === 'exam-response') {
    const item = pending.get(event.data.id);
    if (!item) return;
    clearTimeout(item.timer); pending.delete(event.data.id);
    if (event.data.error) item.reject(new Error(event.data.error)); else item.resolve(event.data.body);
  }
});
function request(path, method = 'GET', data) {
  if (!ready) return Promise.reject(new Error('Hãy mở trang luyện thi trong ứng dụng và đăng nhập.'));
  return new Promise((resolve, reject) => {
    const id = crypto.randomUUID();
    const timer = setTimeout(() => { pending.delete(id); reject(new Error('Máy chủ phản hồi quá chậm. Vui lòng thử lại.')); }, 30000);
    pending.set(id, { resolve, reject, timer });
    parent.postMessage({ type: 'exam-request', id, path, method, data }, location.origin);
  });
}
const api = (path, method, data) => request('/api/custom-exams' + path, method, data);
async function loadBanks() {
  try {
    const banks = await request('/api/question-banks');
    const selected = query.get('bank') + '/' + query.get('version');
    $('bankChoice').replaceChildren(new Option('Chọn ngân hàng', ''));
    banks.forEach(bank => {
      const option = new Option(`${bank.title} · ${bank.version}`, bank.id + '/' + bank.version);
      option.dataset.profile = JSON.stringify(bank.profile); $('bankChoice').append(option);
    });
    $('bankChoice').value = selected;
    $('bankChoice').dispatchEvent(new Event('change'));
    if (query.has('count')) $('count').value = query.get('count');
    if (!banks.length) notice('Chưa có ngân hàng câu hỏi đã xuất bản.');
  } catch (error) { notice(error.message); }
}
async function loadTemplates() {
  try {
    const templates = await request('/api/exam-templates');
    $('templateChoice').replaceChildren(new Option('Chọn đề mẫu', ''));
    templates.forEach(template => {
      const option = new Option(`${template.title} · ${template.version} · ${template.questionIds.length} câu · ${template.durationMinutes} phút`, `${template.examCode}/${template.version}`);
      $('templateChoice').append(option);
    });
  } catch (error) { notice(error.message); }
}
$('bankChoice').onchange = () => {
  const [id, version] = $('bankChoice').value.split('/');
  $('category').value = id || ''; $('version').value = version || '';
  const option = $('bankChoice').selectedOptions[0];
  if (option?.dataset.profile) {
    const profile = JSON.parse(option.dataset.profile);
    $('count').value = profile.questionCount;
    $('minutes').value = Math.max(1, Math.ceil(profile.durationSeconds / 60));
  }
};
function render(data) {
  exam = data;
  $('setup').hidden = true; $('exam').hidden = false;
  $('examId').textContent = data.examId;
  $('practiceTarget').textContent = `Mục tiêu: đúng ít nhất ${data.passingScore}/${data.questions.length} câu${data.failOnCriticalWrong ? ' và không sai câu điểm liệt' : ''}.`;
  $('resumeId').value = data.examId;
  const container = $('questions'); container.replaceChildren();
  data.questions.forEach((question, index) => {
    const article = document.createElement('article');
    const title = document.createElement('h3'); title.textContent = `Câu ${index + 1}: ${question.text}`;
    const group = document.createElement('fieldset'); group.disabled = data.status !== 'Active';
    question.options.forEach(option => {
      const label = document.createElement('label');
      const radio = document.createElement('input');
      radio.type = 'radio'; radio.name = 'q-' + question.id; radio.value = option.id;
      radio.checked = data.answers[question.id] === option.id;
      radio.onchange = () => save(question.id, option.id);
      label.append(radio, document.createTextNode(option.text)); group.append(label);
    });
    article.append(title);
    (question.assets || []).forEach(asset => {
      const image = document.createElement('img'); image.src = asset.url; image.alt = asset.altText;
      image.referrerPolicy = 'no-referrer'; image.style.maxWidth = '100%'; image.style.maxHeight = '350px';
      article.append(image);
    });
    article.append(group); container.append(article);
  });
  $('submit').disabled = data.status === 'Submitted';
  $('review').hidden = data.status !== 'Submitted' || !data.attemptId;
  tick();
}
async function save(questionId, optionId) {
  if (busy || !exam || exam.status !== 'Active') return;
  busy = true; document.querySelectorAll('#questions fieldset').forEach(e => e.disabled = true);
  try {
    const saved = await api(`/${exam.examId}/answers/${encodeURIComponent(questionId)}`, 'PUT',
      { optionId, revision: exam.revision });
    render(saved); notice('Đã lưu câu trả lời.');
  } catch (error) {
    notice(error.message);
    try { render(await api('/' + exam.examId)); } catch { /* show the original error */ }
  } finally { busy = false; }
}
async function submit() {
  if (!exam || submitting || busy) return;
  submitting = true; $('submit').disabled = true;
  try {
    const score = await api('/' + exam.examId + '/submit', 'POST');
    notice(`Đã nộp bài. Đúng ${score.correct}/${score.total} câu.`);
    render({ ...exam, status: 'Submitted', attemptId: score.attemptId });
    openReview(score.attemptId);
  } catch (error) { notice(error.message); $('submit').disabled = false; }
  finally { submitting = false; }
}
async function loadNotifications() {
  if (!ready) return;
  try {
    const items = await request('/api/exam-notifications');
    $('notifications').hidden = items.length === 0;
    const list = $('notificationList'); list.replaceChildren();
    items.forEach(item => {
      const li = document.createElement('li');
      li.textContent = `Đề ${item.examId}: đúng ${item.correct}/${item.total} câu.`;
      list.append(li);
    });
  } catch { /* notification polling does not interrupt the exam */ }
}
function tick() {
  if (!exam) return;
  const left = Math.max(0, Math.ceil((new Date(exam.deadlineUtc).getTime() - Date.now()) / 1000));
  $('timer').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  if (left === 0 && exam.status === 'Active' && !busy) submit();
}
$('create').onclick = async () => {
  try {
    const data = await api('', 'POST', { categoryId: $('category').value.trim(),
      bankVersion: $('version').value.trim(), questionCount: Number($('count').value),
      durationMinutes: Number($('minutes').value) });
    render(data); notice('Đề đã tạo.');
  } catch (error) { notice(error.message); }
};
$('createTemplate').onclick = async () => {
  const [examCode, version] = $('templateChoice').value.split('/');
  if (!examCode) { notice('Hãy chọn đề mẫu.'); return; }
  try {
    render(await api('/from-template', 'POST', { examCode, version: Number(version) }));
    notice('Đề mẫu đã tạo.');
  } catch (error) { notice(error.message); }
};
$('resume').onclick = async () => {
  try { render(await api('/' + encodeURIComponent($('resumeId').value.trim()))); notice('Đã khôi phục đề.'); }
  catch (error) { notice(error.message); }
};
$('submit').onclick = submit;
$('review').onclick = () => openReview(exam?.attemptId);
function openReview(attemptId) {
  if (attemptId) parent.postMessage({ type: 'exam-review', attemptId }, location.origin);
}
setInterval(tick, 1000);
setInterval(loadNotifications, 10000);
</script>
</body>
</html>
