services:
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - traffic-rag-net

  kafka-init:
    image: confluentinc/cp-kafka:7.9.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      'until kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do sleep 2; done;
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic exam-submitted-events --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic exam-submitted-events-dlq --partitions 3 --replication-factor 1'
    networks:
      - traffic-rag-net

  worker-service:
    build:
      context: .
      dockerfile: WorkerService/Dockerfile
    image: traffic-rag-exam-worker:local
    command: null
    environment:
      ConnectionStrings__Redis: redis:6379
      Exams__Kafka__BootstrapServers: kafka:29092
      Exams__Kafka__Topic: exam-submitted-events
      Exams__Kafka__DeadLetterTopic: exam-submitted-events-dlq
      Exams__Kafka__GroupId: exam-notification-worker-v1
      Exams__UserBaseUrl: ${EXAM_USER_BASE_URL:-http://user-service:8080/}
      Exams__SaveResultPath: ${EXAM_SAVE_RESULT_PATH:-api/internal/exam-results}
      Exams__InternalApiKey: ${EXAM_INTERNAL_API_KEY:-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  rest-api-service:
    environment:
      Exams__Kafka__BootstrapServers: kafka:29092
      Exams__Kafka__Topic: exam-submitted-events
      Exams__ContentBaseUrl: ${EXAM_CONTENT_BASE_URL:-http://content-service:8080/}
      Exams__ContentQuestionsPath: ${EXAM_CONTENT_QUESTIONS_PATH:-api/internal/exam-questions}
      Exams__UserBaseUrl: ${EXAM_USER_BASE_URL:-http://user-service:8080/}
      Exams__SaveResultPath: ${EXAM_SAVE_RESULT_PATH:-api/internal/exam-results}
      Exams__InternalApiKey: ${EXAM_INTERNAL_API_KEY:-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
