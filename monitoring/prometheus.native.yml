# Scrape the existing Windows-hosted local-learning processes from Docker Desktop.
# Use PROMETHEUS_CONFIG_FILE=prometheus.native.yml for this hybrid local layout.
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: user-api
    static_configs:
      - targets: ['host.docker.internal:15039']
  - job_name: content-api
    static_configs:
      - targets: ['host.docker.internal:15040']
  - job_name: gateway
    static_configs:
      - targets: ['host.docker.internal:18080']
  - job_name: worker
    static_configs:
      - targets: ['host.docker.internal:15042']
  - job_name: grpc-inference
    static_configs:
      - targets: ['host.docker.internal:8000']
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
