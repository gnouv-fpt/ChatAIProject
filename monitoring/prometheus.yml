global:
  scrape_interval: 15s
scrape_configs:
  - job_name: rest-api
    static_configs:
      - targets: ['rest-api-service:8080']
  - job_name: gateway
    static_configs:
      - targets: ['api-gateway:8080']
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
  # Worker/Khoi add their real metrics endpoints here when delivered.
