groups:
  - name: traffic-rag-local
    rules:
      - alert: ServiceDown
        expr: up{job=~"user-api|content-api|gateway|worker|grpc-inference|kafka"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Local service {{ $labels.job }} is unavailable"
      - alert: KafkaConsumerLag
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag{consumergroup=~"exam-notification-worker-v1|local-learning-notifications-v1"}) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Exam notification backlog is above 10 for five minutes"
      - alert: KafkaProcessingFailures
        expr: increase(exam_event_failed_total{job="worker"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Exam notification processing sent events to DLQ"
